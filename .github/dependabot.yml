version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm / pnpm workspace dependencies (spec §40: dependency scanning)
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/apps/*'
      - '/packages/*'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Oslo'
    open-pull-requests-limit: 5
    versioning-strategy: 'increase'
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      # One PR per week for all non-breaking updates. Majors stay separate so
      # they get a real review.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
      security:
        applies-to: security-updates
        patterns:
          - '*'

  # ---------------------------------------------------------------------------
  # GitHub Actions used by .github/workflows/*
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Oslo'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
