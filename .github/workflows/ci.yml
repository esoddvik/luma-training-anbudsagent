name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Dummy, obviously-fake values so Zod env validation passes in CI.
# Nothing here is or may ever be a real secret.
env:
  NODE_ENV: test
  # Keep this 'true'. It arms the database guard in
  # packages/db/src/testing/harness.ts, which reads CI as a flag — '', '0' and
  # 'false' all count as "not CI". Setting CI: 'false' on a job (the documented
  # way to stop a Next build treating warnings as errors) also disarms the
  # guard for that job, so its integration tests would silently skip.
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_CACHE_DIR: .turbo/cache
  APP_URL: http://localhost:3000
  API_URL: http://localhost:8080
  MCP_URL: http://localhost:8081
  AUTH_SECRET: test-secret-not-real
  MCP_TOKEN_PEPPER: test-secret-not-real
  SHARE_TOKEN_SECRET: test-secret-not-real
  CRON_SECRET: test-secret-not-real
  POSTMARK_SERVER_TOKEN: test-secret-not-real
  DOFFIN_SUBSCRIPTION_KEY: test-secret-not-real
  LUMA_PRIVACY_POLICY_URL: http://localhost:3000/personvern
  TENDER_SERVICE_TERMS_URL: http://localhost:3000/vilkar

jobs:
  quality:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup v4 reads the version
      # from the `packageManager` field in package.json (pnpm@10.28.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-quality-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ORDER MATTERS: format:check must stay ahead of typecheck and build.
      # `next typegen` (run by apps/web's typecheck) and `next build` both
      # regenerate apps/web/next-env.d.ts, which Next writes with double quotes
      # and prettier rejects under the repo's singleQuote config. The file is
      # gitignored so it is absent from a fresh checkout — running format:check
      # first is what keeps this job green. Do not reorder these steps.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Resolves every §-citation in the repo against the specification's
      # headings. Cheap, and needs no build, so it runs before typecheck.
      - name: Check specification citations
        run: pnpm check:citations

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # LOAD-BEARING. All 13 integration suites need a real PostgreSQL. Without
    # this service they do not fail — they skip, and the job reports success
    # having verified nothing about cross-user isolation, the shared-view leak,
    # consent immutability (ADR-9), attribution isolation (ADR-6) or account
    # deletion (§40). Do not remove this block to make a red build go green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luma
          POSTGRES_PASSWORD: luma
          POSTGRES_DB: luma_anbudsvarsling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luma -d luma_anbudsvarsling_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-test-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: postgres://luma:luma@localhost:5432/luma_anbudsvarsling_test
        run: pnpm db:migrate

      - name: Run tests
        env:
          # REQUIRED — do not delete to make a red build go green.
          # packages/db/src/testing/harness.ts throws at import time when CI is
          # set without DATABASE_URL. That guard exists because the integration
          # suites skip themselves when there is no database, so removing this
          # line does not disable a few tests — it makes the whole job pass
          # while verifying nothing. If this goes red for a missing database,
          # fix the database, not this line or the postgres service above.
          DATABASE_URL: postgres://luma:luma@localhost:5432/luma_anbudsvarsling_test
        run: pnpm test
