name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Dummy, obviously-fake values so Zod env validation passes in CI.
# Nothing here is or may ever be a real secret.
env:
  NODE_ENV: test
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  TURBO_CACHE_DIR: .turbo/cache
  APP_URL: http://localhost:3000
  API_URL: http://localhost:8080
  MCP_URL: http://localhost:8081
  AUTH_SECRET: test-secret-not-real
  MCP_TOKEN_PEPPER: test-secret-not-real
  SHARE_TOKEN_SECRET: test-secret-not-real
  CRON_SECRET: test-secret-not-real
  POSTMARK_SERVER_TOKEN: test-secret-not-real
  DOFFIN_SUBSCRIPTION_KEY: test-secret-not-real
  LUMA_PRIVACY_POLICY_URL: http://localhost:3000/personvern
  TENDER_SERVICE_TERMS_URL: http://localhost:3000/vilkar
  DATABASE_URL: postgres://luma:luma@localhost:5432/luma_anbudsvarsling_test

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luma
          POSTGRES_PASSWORD: luma
          POSTGRES_DB: luma_anbudsvarsling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luma -d luma_anbudsvarsling_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup v4 reads the version
      # from the `packageManager` field in package.json (pnpm@10.28.0).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-e2e-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate

      - name: Build web
        run: pnpm turbo run build --filter=web

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm --filter web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
