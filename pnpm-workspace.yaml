packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild
  - "@tailwindcss/oxide"
  - sharp
  - unrs-resolver

# Single source of truth for third-party versions across every workspace
# package, so the three deployed services never drift apart.
#
# The MCP SDK is pinned exactly: spec section 29 requires exact versions and
# forbids alpha features in the MVP. Everything else takes a caret range.
catalog:
  # Language and tooling
  typescript: ^5.9.3
  tsx: ^4.23.5
  vite: ^7.3.1
  vitest: ^4.1.10
  "@vitest/coverage-v8": ^4.1.10

  # Shared runtime libraries
  zod: ^4.4.3
  pino: ^10.3.1
  pino-pretty: ^13.1.3

  # Data
  "drizzle-orm": ^0.45.2
  "drizzle-kit": ^0.31.10
  postgres: ^3.4.9
  "pg-boss": ^12.26.4

  # Services
  fastify: ^5.11.2
  "@fastify/cors": ^11.3.0
  "@fastify/helmet": ^13.1.0
  "@fastify/rate-limit": ^11.2.0
  "@fastify/cookie": ^11.1.2
  "@modelcontextprotocol/sdk": 1.30.0
  postmark: ^5.1.0

  # Web
  next: ^16.2.12
  react: ^19.2.8
  "react-dom": ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  "@playwright/test": ^1.62.1

  # Types
  "@types/node": ^22.20.1
