packages:
  - 'apps/*'
  - 'packages/*'

onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'
  - sharp
  - unrs-resolver

# Single source of truth for third-party versions across every workspace
# package, so the three deployed services never drift apart.
#
# The MCP SDK is pinned exactly: spec section 29 requires exact versions and
# forbids alpha features in the MVP. Everything else takes a caret range.
catalog:
  # Language and tooling
  typescript: ^5.9.3
  tsx: ^4.23.15
  vite: ^7.3.1
  vitest: ^4.1.10
  '@vitest/coverage-v8': ^4.1.10

  # Shared runtime libraries
  zod: ^4.6.5
  pino: ^10.4.0
  pino-pretty: ^13.2.0

  # Data
  'drizzle-orm': ^0.45.4
  'drizzle-kit': ^0.31.11
  postgres: ^3.4.9
  'pg-boss': ^12.37.1

  # Services
  fastify: ^5.12.5
  '@fastify/cors': ^11.3.1
  '@fastify/helmet': ^13.1.2
  '@fastify/rate-limit': ^11.2.1
  '@fastify/cookie': ^11.1.3
  '@modelcontextprotocol/sdk': 1.32.1
  postmark: ^5.1.0

  # Web
  next: ^16.4.0
  react: ^19.3.0
  'react-dom': ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  '@playwright/test': ^1.64.0

  # Types
  '@types/node': ^22.20.1
